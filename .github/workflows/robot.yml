name: Build robot

on:
  push:
    branches:
      - main
      - next
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [ 17, 21, 25 ]
    name: Java ${{ matrix.java }} build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: zulu
          cache: maven
      - name: Build
        run: TZ=UTC ./mvnw -B -U verify
      # The jar handed to users is built by the oldest supported JDK
      - name: Upload jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: nfc4pc.jar
          path: target/nfc4pc.jar
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.java == '17'
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: target/nfc4pc.jar
          fail_on_unmatched_files: true
          body: Release ${{ github.ref_name }}
          prerelease: true # manually promoted
